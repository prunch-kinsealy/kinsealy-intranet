<!DOCTYPE html>
<script>if(!sessionStorage.getItem('kmc-auth')){sessionStorage.setItem('kmc-redirect',location.href);location.replace('login.html')}</script>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects — Kinsealy Staff Hub</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1a2d4a;--navy-light:#243c61;--teal:#2a8a7e;--teal-light:#3aa897;--teal-pale:#e8f5f3;
  --gold:#c9a84c;--cream:#f8f6f1;--white:#fff;
  --grey-100:#f4f4f4;--grey-200:#e8e8e8;--grey-400:#9ca3af;--grey-700:#374151;
  --text:#1f2937;--radius:10px;
  --col-todo:#9ca3af;--col-doing:#2a8a7e;--col-done:#22a35e;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text);min-height:100vh}

/* HEADER */
.header{background:var(--navy);color:#fff;padding:18px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
.header h1{font-family:'DM Serif Display',serif;font-size:1.2rem}
.header span{font-size:0.7rem;opacity:0.5;letter-spacing:0.1em;text-transform:uppercase}
.back-btn{font-size:0.78rem;color:rgba(255,255,255,0.7);text-decoration:none;display:flex;align-items:center;gap:5px;transition:color 0.15s}
.back-btn:hover{color:#fff}
.sync-status{font-size:0.68rem;color:rgba(255,255,255,0.45);margin-top:2px}

#app{max-width:1080px;margin:0 auto;padding:32px 24px 60px}
.page-header{margin-bottom:24px}
.page-header h2{font-family:'DM Serif Display',serif;font-size:1.75rem;color:var(--navy);margin-bottom:4px}
.page-header p{font-size:0.88rem;color:var(--grey-400)}

/* TOOLBAR */
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.archive-toggle{display:flex;align-items:center;gap:8px;font-size:0.8rem;color:var(--grey-700);cursor:pointer}
.archive-toggle input{width:15px;height:15px;accent-color:var(--teal);cursor:pointer}
.btn{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:0.85rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:background 0.15s;white-space:nowrap}
.btn:hover{background:var(--teal)}
.btn-outline{background:#fff;color:var(--navy);border:1px solid var(--grey-200)}
.btn-outline:hover{background:var(--teal-pale);border-color:var(--teal);color:var(--navy)}
.btn-danger{background:#fff;color:#dc2626;border:1px solid #fecaca}
.btn-danger:hover{background:#fee2e2}
.btn-sm{padding:6px 12px;font-size:0.76rem}

/* PROJECT CARDS GRID */
.projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.project-card{background:var(--white);border:1px solid var(--grey-200);border-radius:12px;padding:20px;cursor:pointer;transition:border-color 0.15s,box-shadow 0.15s,transform 0.1s;border-top:3px solid var(--gold);position:relative}
.project-card:hover{border-color:var(--teal);box-shadow:0 6px 18px rgba(26,45,74,0.08);transform:translateY(-2px)}
.project-card.is-archived{opacity:0.6;border-top-color:var(--grey-400)}
.project-card .p-emoji{font-size:1.8rem;margin-bottom:10px}
.project-card .p-name{font-family:'DM Serif Display',serif;font-size:1.15rem;color:var(--navy);margin-bottom:10px;line-height:1.3}
.project-card .p-progress-bar{background:var(--grey-100);border-radius:6px;height:6px;overflow:hidden;margin-bottom:8px}
.project-card .p-progress-fill{background:var(--teal);height:100%;transition:width 0.2s}
.project-card .p-progress-text{font-size:0.72rem;color:var(--grey-400);margin-bottom:10px}
.p-chips{display:flex;gap:4px;flex-wrap:wrap}
.p-chip{width:24px;height:24px;border-radius:50%;background:var(--teal-pale);color:var(--teal);font-size:0.62rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.new-project-card{background:transparent;border:2px dashed var(--grey-200);border-radius:12px;padding:20px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--grey-400);font-size:0.85rem;font-weight:600;min-height:150px;transition:border-color 0.15s,color 0.15s}
.new-project-card:hover{border-color:var(--teal);color:var(--teal)}
.new-project-card .plus{font-size:1.8rem}
.empty-note{text-align:center;color:var(--grey-400);font-size:0.85rem;padding:30px;grid-column:1/-1}

/* BOARD VIEW */
#board-view{display:none}
.board-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.board-title{display:flex;align-items:center;gap:12px}
.board-title .b-emoji{font-size:2rem}
.board-title h2{font-family:'DM Serif Display',serif;font-size:1.6rem;color:var(--navy)}
.board-actions{display:flex;gap:8px}
.board-columns{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:start}
.board-col{background:var(--grey-100);border-radius:12px;padding:14px;min-height:120px;transition:background 0.15s}
.board-col.drag-over{background:var(--teal-pale)}
.col-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:0 4px}
.col-dot{width:9px;height:9px;border-radius:50%}
.col-head span.col-name{font-size:0.78rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--grey-700)}
.col-count{margin-left:auto;background:var(--white);border-radius:10px;padding:1px 9px;font-size:0.7rem;font-weight:700;color:var(--grey-700)}
.task-card{background:var(--white);border:1px solid var(--grey-200);border-radius:9px;padding:12px 14px;margin-bottom:10px;cursor:grab;transition:box-shadow 0.15s,border-color 0.15s}
.task-card:hover{border-color:var(--teal);box-shadow:0 3px 10px rgba(26,45,74,0.07)}
.task-card.dragging{opacity:0.4}
.task-card h4{font-size:0.85rem;font-weight:600;color:var(--navy);margin-bottom:6px;line-height:1.35}
.task-meta-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:0.68rem;color:var(--grey-400)}
.task-assignee{background:var(--teal-pale);color:var(--teal);border-radius:5px;padding:2px 7px;font-weight:600}
.task-due{background:var(--grey-100);border-radius:5px;padding:2px 7px}
.task-due.overdue{background:#fee2e2;color:#dc2626;font-weight:600}
.add-task-btn{width:100%;background:transparent;border:1px dashed var(--grey-200);border-radius:8px;padding:9px;font-size:0.78rem;color:var(--grey-400);cursor:pointer;font-family:'DM Sans',sans-serif;transition:border-color 0.15s,color 0.15s}
.add-task-btn:hover{border-color:var(--teal);color:var(--teal)}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(26,45,74,0.45);z-index:100;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:var(--white);border-radius:14px;padding:28px;max-width:440px;width:100%;max-height:90vh;overflow-y:auto}
.modal h3{font-family:'DM Serif Display',serif;font-size:1.25rem;color:var(--navy);margin-bottom:18px}
.field{margin-bottom:14px;text-align:left}
.field label{font-size:0.75rem;font-weight:600;color:var(--grey-700);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.06em}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--grey-200);border-radius:8px;padding:10px 14px;font-size:0.88rem;font-family:'DM Sans',sans-serif;outline:none;transition:border 0.15s;background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal)}
.field textarea{min-height:70px;resize:vertical;line-height:1.5}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.modal-actions .btn{flex:1}

@media (max-width:820px){
  .board-columns{grid-template-columns:1fr}
  .form-row{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>🗂️ Projects</h1>
    <span>Kinsealy Staff Hub</span>
    <div class="sync-status" id="sync-status">Loading…</div>
  </div>
  <a href="index.html" class="back-btn">← Back to Staff Hub</a>
</div>

<div id="app">

  <!-- LANDING VIEW -->
  <div id="landing-view">
    <div class="page-header">
      <h2>Projects</h2>
      <p>Track the practice's non-clinical projects — hiring, building work, anything that isn't a patient issue. Anyone can add or update a task.</p>
    </div>
    <div class="toolbar">
      <label class="archive-toggle"><input type="checkbox" id="show-archived" onchange="renderLanding()"> Show archived projects</label>
      <button class="btn" onclick="openNewProjectModal()">+ New Project</button>
    </div>
    <div class="projects-grid" id="projects-grid"></div>
  </div>

  <!-- BOARD VIEW -->
  <div id="board-view">
    <a href="#" class="back-btn" style="color:var(--grey-400);display:inline-flex;margin-bottom:16px" onclick="backToLanding();return false">← All Projects</a>
    <div class="board-header">
      <div class="board-title">
        <span class="b-emoji" id="board-emoji"></span>
        <h2 id="board-name"></h2>
      </div>
      <div class="board-actions">
        <button class="btn btn-outline btn-sm" id="archive-btn" onclick="toggleArchiveCurrent()"></button>
        <button class="btn btn-danger btn-sm" onclick="deleteCurrentProject()">Delete Project</button>
      </div>
    </div>
    <div class="board-columns">
      <div class="board-col" data-column="todo" ondragover="onColDragOver(event)" ondragleave="onColDragLeave(event)" ondrop="onColDrop(event,'todo')">
        <div class="col-head"><span class="col-dot" style="background:var(--col-todo)"></span><span class="col-name">To Do</span><span class="col-count" id="count-todo">0</span></div>
        <div id="list-todo"></div>
        <button class="add-task-btn" onclick="openNewTaskModal('todo')">+ Add task</button>
      </div>
      <div class="board-col" data-column="doing" ondragover="onColDragOver(event)" ondragleave="onColDragLeave(event)" ondrop="onColDrop(event,'doing')">
        <div class="col-head"><span class="col-dot" style="background:var(--col-doing)"></span><span class="col-name">In Progress</span><span class="col-count" id="count-doing">0</span></div>
        <div id="list-doing"></div>
        <button class="add-task-btn" onclick="openNewTaskModal('doing')">+ Add task</button>
      </div>
      <div class="board-col" data-column="done" ondragover="onColDragOver(event)" ondragleave="onColDragLeave(event)" ondrop="onColDrop(event,'done')">
        <div class="col-head"><span class="col-dot" style="background:var(--col-done)"></span><span class="col-name">Done</span><span class="col-count" id="count-done">0</span></div>
        <div id="list-done"></div>
        <button class="add-task-btn" onclick="openNewTaskModal('done')">+ Add task</button>
      </div>
    </div>
  </div>

</div>

<!-- NEW PROJECT MODAL -->
<div class="modal-overlay" id="project-modal">
  <div class="modal">
    <h3>New Project</h3>
    <div class="form-row">
      <div class="field" style="grid-column:1/-1">
        <label>Project Name</label>
        <input type="text" id="proj-name" placeholder="e.g. Garden Room Build">
      </div>
    </div>
    <div class="field">
      <label>Icon (emoji)</label>
      <input type="text" id="proj-emoji" placeholder="📁" maxlength="4">
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('project-modal')">Cancel</button>
      <button class="btn" onclick="createProject()">Create Project</button>
    </div>
  </div>
</div>

<!-- TASK MODAL -->
<div class="modal-overlay" id="task-modal">
  <div class="modal">
    <h3 id="task-modal-title">New Task</h3>
    <input type="hidden" id="task-id">
    <div class="field">
      <label>Title</label>
      <input type="text" id="task-title" placeholder="e.g. Get 3 builder quotes">
    </div>
    <div class="field">
      <label>Notes (optional)</label>
      <textarea id="task-notes" placeholder="Any extra detail…"></textarea>
    </div>
    <div class="form-row">
      <div class="field">
        <label>Assigned To</label>
        <select id="task-assignee"><option value="">— Unassigned —</option></select>
      </div>
      <div class="field">
        <label>Due Date (optional)</label>
        <input type="date" id="task-due">
      </div>
    </div>
    <div class="field">
      <label>Column</label>
      <select id="task-column">
        <option value="todo">To Do</option>
        <option value="doing">In Progress</option>
        <option value="done">Done</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-danger" id="task-delete-btn" style="display:none" onclick="deleteTaskFromModal()">Delete</button>
      <button class="btn btn-outline" onclick="closeModal('task-modal')">Cancel</button>
      <button class="btn" onclick="saveTaskModal()">Save</button>
    </div>
  </div>
</div>

<script>
const GH_FILE = 'projects.json';
const STAFF = ["Dr O'Reilly","Dr Dundon","Maria Harding","Dr Dunleavy","Dr Devlin","Dr Dunne",
  "Laura McGrath","Susan O'Leary","Michaela Duffy-Meade","Holly McCamley","Edel Grimes","Amy Burke"];
const COL_LABELS = {todo:'To Do', doing:'In Progress', done:'Done'};
const CURRENT_USER = sessionStorage.getItem('kmc-display') || 'Staff';

let projects = [];
let currentProjectId = null;
let dragTaskId = null;
let modalMode = null; // 'new-task' | 'edit-task'
let modalColumn = null;

// ── assignee dropdown ──
document.getElementById('task-assignee').innerHTML += STAFF.map(n => `<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('');

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ── load / save ──
function kmcAuthHeader() {
  const token = sessionStorage.getItem('kmc-token');
  return token ? { 'Authorization': 'Bearer ' + token } : {};
}

async function fetchLatest(){
  const r = await fetch('/.netlify/functions/gh-proxy?file=' + encodeURIComponent(GH_FILE) + '&t=' + Date.now(), { cache: 'no-store', headers: kmcAuthHeader() });
  if (r.status === 401) { sessionStorage.clear(); location.replace('login.html'); throw new Error('Session expired'); }
  if(!r.ok) throw new Error('load failed');
  const j = await r.json();
  return j.json || [];
}

async function saveAll(data){
  const r = await fetch('/.netlify/functions/gh-proxy', {
    method: 'POST',
    headers: Object.assign({ 'Content-Type': 'application/json' }, kmcAuthHeader()),
    body: JSON.stringify({ file: GH_FILE, content: data, message: 'Update projects ' + new Date().toISOString().slice(0,10) })
  });
  if (r.status === 401) { sessionStorage.clear(); location.replace('login.html'); throw new Error('Session expired'); }
  if(!r.ok) throw new Error('save failed');
}

// Fetch fresh data, apply a single change, save, then update local state + re-render.
async function mutate(fn){
  const status = document.getElementById('sync-status');
  status.textContent = 'Saving…';
  try{
    const fresh = await fetchLatest();
    const updated = fn(fresh) || fresh;
    await saveAll(updated);
    projects = updated;
    status.textContent = '✓ Synced';
    renderCurrentView();
  }catch(e){
    status.textContent = 'Save failed — try again';
  }
}

async function loadProjects(){
  const status = document.getElementById('sync-status');
  status.textContent = 'Loading…';
  try{
    projects = await fetchLatest();
    status.textContent = '✓ Synced';
  }catch(e){
    status.textContent = 'Offline or error';
  }
  renderCurrentView();
}

function renderCurrentView(){
  if(currentProjectId !== null && projects.find(p => p.id === currentProjectId)){
    document.getElementById('landing-view').style.display = 'none';
    document.getElementById('board-view').style.display = 'block';
    renderBoard();
  } else {
    currentProjectId = null;
    document.getElementById('board-view').style.display = 'none';
    document.getElementById('landing-view').style.display = 'block';
    renderLanding();
  }
}

// ── landing view ──
function renderLanding(){
  const showArchived = document.getElementById('show-archived').checked;
  const grid = document.getElementById('projects-grid');
  const visible = projects.filter(p => showArchived ? true : !p.archived);

  let html = visible.map(p => {
    const total = p.tasks.length;
    const done = p.tasks.filter(t => t.column === 'done').length;
    const pct = total ? Math.round(done / total * 100) : 0;
    const assignees = [...new Set(p.tasks.filter(t => t.assignee && t.column !== 'done').map(t => t.assignee))].slice(0,4);
    const chips = assignees.map(a => `<div class="p-chip" title="${escapeHtml(a)}">${escapeHtml(initials(a))}</div>`).join('');
    return `
      <div class="project-card ${p.archived ? 'is-archived':''}" onclick="openProject(${p.id})">
        <div class="p-emoji">${escapeHtml(p.emoji || '📁')}</div>
        <div class="p-name">${escapeHtml(p.name)}${p.archived ? ' <span style=\"font-size:0.65rem;color:var(--grey-400);font-family:\'DM Sans\',sans-serif;font-weight:600\">(Archived)</span>':''}</div>
        <div class="p-progress-bar"><div class="p-progress-fill" style="width:${pct}%"></div></div>
        <div class="p-progress-text">${done}/${total} tasks done</div>
        <div class="p-chips">${chips}</div>
      </div>`;
  }).join('');

  html += `<div class="new-project-card" onclick="openNewProjectModal()"><div class="plus">+</div>New Project</div>`;

  if(visible.length === 0){
    grid.innerHTML = `<div class="empty-note">No projects yet — click "+ New Project" to start one.</div><div class="new-project-card" onclick="openNewProjectModal()"><div class="plus">+</div>New Project</div>`;
  } else {
    grid.innerHTML = html;
  }
}

function initials(name){
  return name.split(/\s+/).map(w => w[0]).join('').slice(0,2).toUpperCase();
}

// ── board view ──
function openProject(id){
  currentProjectId = id;
  document.getElementById('landing-view').style.display = 'none';
  document.getElementById('board-view').style.display = 'block';
  renderBoard();
}

function backToLanding(){
  currentProjectId = null;
  document.getElementById('board-view').style.display = 'none';
  document.getElementById('landing-view').style.display = 'block';
  renderLanding();
}

function renderBoard(){
  const p = projects.find(pr => pr.id === currentProjectId);
  if(!p){ backToLanding(); return; }

  document.getElementById('board-emoji').textContent = p.emoji || '📁';
  document.getElementById('board-name').textContent = p.name;
  const archiveBtn = document.getElementById('archive-btn');
  archiveBtn.textContent = p.archived ? '↩ Unarchive' : '📦 Archive';

  ['todo','doing','done'].forEach(col => {
    const tasks = p.tasks.filter(t => t.column === col);
    document.getElementById('count-' + col).textContent = tasks.length;
    const list = document.getElementById('list-' + col);
    const now = new Date(); now.setHours(0,0,0,0);
    list.innerHTML = tasks.map(t => {
      const isOverdue = t.dueDate && col !== 'done' && new Date(t.dueDate) < now;
      const dueText = t.dueDate ? new Date(t.dueDate).toLocaleDateString('en-IE',{day:'numeric',month:'short'}) : '';
      return `
        <div class="task-card" draggable="true" ondragstart="onTaskDragStart(event,${t.id})" ondragend="onTaskDragEnd(event)" onclick="openEditTaskModal(${t.id})">
          <h4>${escapeHtml(t.title)}</h4>
          <div class="task-meta-row">
            ${t.assignee ? `<span class="task-assignee">${escapeHtml(t.assignee)}</span>` : ''}
            ${t.dueDate ? `<span class="task-due ${isOverdue?'overdue':''}">${isOverdue?'⚠ ':''}${dueText}</span>` : ''}
          </div>
        </div>`;
    }).join('');
  });
}

function toggleArchiveCurrent(){
  const id = currentProjectId;
  mutate(fresh => {
    const p = fresh.find(pr => pr.id === id);
    if(p) p.archived = !p.archived;
    return fresh;
  });
}

function deleteCurrentProject(){
  if(!confirm('Delete this whole project and all its tasks? This cannot be undone.')) return;
  const id = currentProjectId;
  currentProjectId = null;
  mutate(fresh => fresh.filter(pr => pr.id !== id));
}

// ── drag and drop ──
function onTaskDragStart(e, taskId){
  dragTaskId = taskId;
  e.target.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}
function onTaskDragEnd(e){
  e.target.classList.remove('dragging');
}
function onColDragOver(e){
  e.preventDefault();
  e.currentTarget.classList.add('drag-over');
}
function onColDragLeave(e){
  e.currentTarget.classList.remove('drag-over');
}
function onColDrop(e, col){
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if(dragTaskId === null) return;
  const taskId = dragTaskId;
  dragTaskId = null;
  const projId = currentProjectId;
  mutate(fresh => {
    const p = fresh.find(pr => pr.id === projId);
    const t = p && p.tasks.find(tk => tk.id === taskId);
    if(t) t.column = col;
    return fresh;
  });
}

// ── project modal ──
function openNewProjectModal(){
  document.getElementById('proj-name').value = '';
  document.getElementById('proj-emoji').value = '';
  document.getElementById('project-modal').classList.add('open');
  document.getElementById('proj-name').focus();
}

function createProject(){
  const name = document.getElementById('proj-name').value.trim();
  if(!name){ alert('Please enter a project name.'); return; }
  const emoji = document.getElementById('proj-emoji').value.trim() || '📁';
  const newProj = {
    id: Date.now(),
    name, emoji, archived: false,
    createdBy: CURRENT_USER,
    createdAt: new Date().toISOString(),
    tasks: []
  };
  closeModal('project-modal');
  mutate(fresh => { fresh.push(newProj); return fresh; });
}

// ── task modal ──
function openNewTaskModal(col){
  modalMode = 'new-task';
  modalColumn = col;
  document.getElementById('task-modal-title').textContent = 'New Task';
  document.getElementById('task-id').value = '';
  document.getElementById('task-title').value = '';
  document.getElementById('task-notes').value = '';
  document.getElementById('task-assignee').value = '';
  document.getElementById('task-due').value = '';
  document.getElementById('task-column').value = col;
  document.getElementById('task-delete-btn').style.display = 'none';
  document.getElementById('task-modal').classList.add('open');
  document.getElementById('task-title').focus();
}

function openEditTaskModal(taskId){
  const p = projects.find(pr => pr.id === currentProjectId);
  const t = p && p.tasks.find(tk => tk.id === taskId);
  if(!t) return;
  modalMode = 'edit-task';
  document.getElementById('task-modal-title').textContent = 'Edit Task';
  document.getElementById('task-id').value = t.id;
  document.getElementById('task-title').value = t.title;
  document.getElementById('task-notes').value = t.notes || '';
  document.getElementById('task-assignee').value = t.assignee || '';
  document.getElementById('task-due').value = t.dueDate || '';
  document.getElementById('task-column').value = t.column;
  document.getElementById('task-delete-btn').style.display = 'inline-block';
  document.getElementById('task-modal').classList.add('open');
}

function saveTaskModal(){
  const title = document.getElementById('task-title').value.trim();
  if(!title){ alert('Please enter a task title.'); return; }
  const notes = document.getElementById('task-notes').value.trim();
  const assignee = document.getElementById('task-assignee').value;
  const dueDate = document.getElementById('task-due').value;
  const column = document.getElementById('task-column').value;
  const projId = currentProjectId;

  if(modalMode === 'new-task'){
    const newTask = { id: Date.now(), title, notes, assignee, dueDate, column, createdBy: CURRENT_USER, createdAt: new Date().toISOString() };
    closeModal('task-modal');
    mutate(fresh => {
      const p = fresh.find(pr => pr.id === projId);
      if(p) p.tasks.push(newTask);
      return fresh;
    });
  } else {
    const taskId = Number(document.getElementById('task-id').value);
    closeModal('task-modal');
    mutate(fresh => {
      const p = fresh.find(pr => pr.id === projId);
      const t = p && p.tasks.find(tk => tk.id === taskId);
      if(t){ t.title = title; t.notes = notes; t.assignee = assignee; t.dueDate = dueDate; t.column = column; }
      return fresh;
    });
  }
}

function deleteTaskFromModal(){
  if(!confirm('Delete this task?')) return;
  const taskId = Number(document.getElementById('task-id').value);
  const projId = currentProjectId;
  closeModal('task-modal');
  mutate(fresh => {
    const p = fresh.find(pr => pr.id === projId);
    if(p) p.tasks = p.tasks.filter(t => t.id !== taskId);
    return fresh;
  });
}

function closeModal(id){
  document.getElementById(id).classList.remove('open');
}

document.querySelectorAll('.modal-overlay').forEach(ov => {
  ov.addEventListener('click', e => { if(e.target === ov) ov.classList.remove('open'); });
});

// ── keep boards reasonably fresh across simultaneous viewers ──
function anyModalOpen(){
  return document.querySelectorAll('.modal-overlay.open').length > 0;
}
setInterval(() => { if(!anyModalOpen()) loadProjects(); }, 20000);
document.addEventListener('visibilitychange', () => { if(!document.hidden && !anyModalOpen()) loadProjects(); });

const openParam = new URLSearchParams(location.search).get('open');
if(openParam) currentProjectId = Number(openParam);
loadProjects();
</script>
</body>
