<!DOCTYPE html>
<script>if(!sessionStorage.getItem('kmc-auth')){sessionStorage.setItem('kmc-redirect',location.href);location.replace('login.html')}</script>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pending Approvals — Kinsealy Staff Hub</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1a2d4a;--teal:#2a8a7e;--teal-light:#3aa897;--teal-pale:#e8f5f3;
  --gold:#c9a84c;--cream:#f8f6f1;--white:#fff;
  --grey-100:#f4f4f4;--grey-200:#e8e8e8;--grey-400:#9ca3af;--grey-700:#374151;
  --text:#1f2937;--radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text);min-height:100vh}

.header{background:var(--navy);color:#fff;padding:18px 32px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-family:'DM Serif Display',serif;font-size:1.2rem}
.header span{font-size:0.7rem;opacity:0.5;letter-spacing:0.1em;text-transform:uppercase}
.back-btn{font-size:0.78rem;color:rgba(255,255,255,0.7);text-decoration:none;display:flex;align-items:center;gap:5px;transition:color 0.15s}
.back-btn:hover{color:#fff}

#denied{max-width:460px;margin:80px auto;background:var(--white);border-radius:14px;padding:40px;box-shadow:0 4px 24px rgba(0,0,0,0.08);text-align:center;display:none}
#main{max-width:920px;margin:0 auto;padding:32px 20px;display:none}
.section-title{font-family:'DM Serif Display',serif;font-size:1.4rem;color:var(--navy);margin-bottom:4px}
.section-sub{font-size:0.82rem;color:var(--grey-400);margin-bottom:28px}
.empty-state{text-align:center;color:var(--grey-400);font-size:0.88rem;padding:40px 20px;background:var(--white);border-radius:var(--radius);border:1px solid var(--grey-200)}

.item{background:var(--white);border-radius:var(--radius);border:1px solid var(--grey-200);padding:22px 24px;margin-bottom:18px}
.item-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px}
.item-title{font-size:1rem;font-weight:600;color:var(--navy)}
.item-meta{font-size:0.78rem;color:var(--grey-400);margin-top:3px}
.item-note{font-size:0.85rem;color:var(--grey-700);background:var(--teal-pale);border-radius:8px;padding:9px 12px;margin:10px 0}
.badge-mode{font-size:0.66rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;padding:3px 9px;border-radius:20px;background:var(--grey-100);color:var(--grey-700);flex-shrink:0}

.diff-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
.diff-col h4{font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--grey-400);margin-bottom:6px}
.diff-col.proposed h4{color:var(--teal)}
.diff-pre{max-height:340px;overflow:auto;background:var(--grey-100);border-radius:8px;padding:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:0.72rem;line-height:1.5;white-space:pre-wrap;word-break:break-word}
@media (max-width:700px){.diff-grid{grid-template-columns:1fr}}

.actions{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.btn{border:none;border-radius:8px;padding:10px 18px;font-size:0.85rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:background 0.15s}
.btn-approve{background:var(--teal);color:#fff}
.btn-approve:hover{background:var(--teal-light)}
.btn-reject{background:#fff;color:#dc2626;border:1.5px solid #f5c6cb}
.btn-reject:hover{background:#fdf2f2}
.btn:disabled{opacity:0.5;cursor:default}
.note-input{flex:1;min-width:220px;border:1px solid var(--grey-200);border-radius:8px;padding:9px 12px;font-size:0.82rem;font-family:'DM Sans',sans-serif}
.item-error{color:#dc2626;font-size:0.78rem;margin-top:8px;display:none}

.history-toggle{font-size:0.78rem;color:var(--teal);cursor:pointer;text-decoration:underline;margin-top:24px;display:inline-block}
.status-badge{font-size:0.62rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;padding:3px 9px;border-radius:20px}
.status-approved{background:#dcfce7;color:#166534}
.status-rejected{background:#fee2e2;color:#991b1b}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>✅ Pending Approvals</h1>
    <span>Kinsealy Staff Hub — Admin only</span>
  </div>
  <a href="index.html" class="back-btn">← Back to Staff Hub</a>
</div>

<div id="denied">
  <p style="font-size:0.9rem;color:var(--grey-700)">This page is for admin accounts only.</p>
</div>

<div id="main">
  <div class="section-title">Pending Approvals</div>
  <div class="section-sub">Review proposed edits from authorised staff. Nothing here is live until you approve it.</div>
  <div id="pending-list"><div class="empty-state">Loading…</div></div>

  <div class="history-toggle" id="history-toggle" onclick="toggleHistory()">Show reviewed history ▾</div>
  <div id="history-list" style="display:none;margin-top:14px"></div>
</div>

<script>
function _escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function authHeader() {
  const token = sessionStorage.getItem('kmc-token');
  return token ? { 'Authorization': 'Bearer ' + token } : {};
}

if (sessionStorage.getItem('kmc-role') !== 'admin') {
  document.getElementById('denied').style.display = 'block';
} else {
  document.getElementById('main').style.display = 'block';
}

async function fetchEdits() {
  const r = await fetch('/.netlify/functions/edits', { headers: authHeader() });
  if (!r.ok) throw new Error('Could not load pending edits');
  const j = await r.json();
  return j.edits || [];
}

// Pulls the "current" (live) content for a pending entry so it can be shown
// next to the proposal — read straight from the deployed page/file, same as
// a visitor's browser would see it.
async function getCurrentContent(entry) {
  const res = await fetch(entry.file + '?t=' + Date.now(), { cache: 'no-store' });
  if (!res.ok) return '(could not load current content)';
  const text = await res.text();
  if (entry.mode === 'whole') return text;
  const startTag = '<!-- SYNC:' + entry.marker + '-BODY:START -->';
  const endTag = '<!-- SYNC:' + entry.marker + '-BODY:END -->';
  const startIdx = text.indexOf(startTag);
  const endIdx = text.indexOf(endTag);
  if (startIdx === -1 || endIdx === -1) return '(sync markers not found on the live page)';
  return text.slice(startIdx + startTag.length, endIdx).trim();
}

function fmtDate(iso) {
  return new Date(iso).toLocaleDateString('en-IE', { day: 'numeric', month: 'short', year: 'numeric' }) +
    ' ' + new Date(iso).toLocaleTimeString('en-IE', { hour: '2-digit', minute: '2-digit' });
}

async function renderPending() {
  const list = document.getElementById('pending-list');
  let edits;
  try { edits = await fetchEdits(); } catch (e) {
    list.innerHTML = '<div class="empty-state">Could not load pending edits.</div>';
    return;
  }
  const pending = edits.filter(e => e.status === 'pending');
  if (pending.length === 0) {
    list.innerHTML = '<div class="empty-state">Nothing waiting on you right now.</div>';
  } else {
    list.innerHTML = pending.map(e => `
      <div class="item" id="item-${e.id}">
        <div class="item-top">
          <div>
            <div class="item-title">${_escHtml(e.section)} — ${_escHtml(e.file)}</div>
            <div class="item-meta">Submitted by ${_escHtml(e.submittedBy)} · ${fmtDate(e.submittedAt)}</div>
          </div>
          <span class="badge-mode">${e.mode === 'whole' ? 'Full file' : 'Section only'}</span>
        </div>
        ${e.note ? `<div class="item-note">${_escHtml(e.note)}</div>` : ''}
        <div class="diff-grid">
          <div class="diff-col"><h4>Current (live)</h4><pre class="diff-pre" id="current-${e.id}">Loading…</pre></div>
          <div class="diff-col proposed"><h4>Proposed</h4><pre class="diff-pre">${_escHtml(e.proposedContent)}</pre></div>
        </div>
        <div class="actions">
          <input type="text" class="note-input" id="note-${e.id}" placeholder="Optional note (visible to the submitter)">
          <button class="btn btn-approve" onclick="review(${e.id},'approve')">✓ Approve &amp; Publish</button>
          <button class="btn btn-reject" onclick="review(${e.id},'reject')">✕ Reject</button>
        </div>
        <div class="item-error" id="error-${e.id}"></div>
      </div>
    `).join('');
    pending.forEach(async e => {
      const el = document.getElementById('current-' + e.id);
      el.textContent = await getCurrentContent(e);
    });
  }
}

async function review(id, decision) {
  const item = document.getElementById('item-' + id);
  const err = document.getElementById('error-' + id);
  const reviewNote = document.getElementById('note-' + id).value.trim();
  err.style.display = 'none';
  const buttons = item.querySelectorAll('button');
  buttons.forEach(b => b.disabled = true);
  try {
    await (async () => {
      const r = await fetch('/.netlify/functions/edits', {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()),
        body: JSON.stringify({ action: 'review', id, decision, reviewNote })
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || 'Request failed');
    })();
    renderPending();
    renderHistory();
  } catch (e) {
    err.textContent = e.message;
    err.style.display = 'block';
    buttons.forEach(b => b.disabled = false);
  }
}

let historyLoaded = false;
function toggleHistory() {
  const el = document.getElementById('history-list');
  const shown = el.style.display !== 'none';
  el.style.display = shown ? 'none' : 'block';
  document.getElementById('history-toggle').textContent = shown ? 'Show reviewed history ▾' : 'Hide reviewed history ▴';
  if (!shown && !historyLoaded) renderHistory();
}

async function renderHistory() {
  historyLoaded = true;
  const list = document.getElementById('history-list');
  let edits;
  try { edits = await fetchEdits(); } catch (e) {
    list.innerHTML = '<div class="empty-state">Could not load history.</div>';
    return;
  }
  const done = edits.filter(e => e.status !== 'pending');
  if (done.length === 0) {
    list.innerHTML = '<div class="empty-state">No reviewed edits yet.</div>';
    return;
  }
  list.innerHTML = done.map(e => `
    <div class="item">
      <div class="item-top">
        <div>
          <div class="item-title">${_escHtml(e.section)} — ${_escHtml(e.file)}</div>
          <div class="item-meta">Submitted by ${_escHtml(e.submittedBy)} · reviewed by ${_escHtml(e.reviewedBy||'')} ${fmtDate(e.reviewedAt)}</div>
        </div>
        <span class="status-badge status-${e.status}">${e.status}</span>
      </div>
      ${e.reviewNote ? `<div class="item-note">${_escHtml(e.reviewNote)}</div>` : ''}
    </div>
  `).join('');
}

if (sessionStorage.getItem('kmc-role') === 'admin') {
  renderPending();
}
</script>
</body>
</html>
