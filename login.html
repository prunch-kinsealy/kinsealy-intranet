<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kinsealy Medical Centre — Staff Login</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DM Sans',sans-serif;background:#1a2d4a;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .card{background:#fff;border-radius:14px;padding:48px 40px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
  .logo{text-align:center;margin-bottom:32px}
  .logo h1{font-family:'DM Serif Display',serif;font-size:1.3rem;color:#1a2d4a;line-height:1.3}
  .logo span{display:block;font-size:0.68rem;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#2a8a7e;margin-top:4px}
  .logo-divider{width:40px;height:3px;background:#2a8a7e;border-radius:2px;margin:16px auto 0}
  .field{margin-bottom:16px}
  label{display:block;font-size:0.78rem;font-weight:600;color:#374151;margin-bottom:6px;letter-spacing:0.03em}
  input[type=text],input[type=password]{width:100%;padding:11px 14px;border:1.5px solid #e8e8e8;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:0.9rem;color:#1f2937;outline:none;transition:border 0.15s}
  input[type=text]:focus,input[type=password]:focus{border-color:#2a8a7e}
  .pwd-wrap{position:relative}
  .pwd-wrap input{padding-right:44px}
  .show-pwd{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#6b7280;font-size:1rem;padding:4px;line-height:1}
  .show-pwd:hover{color:#374151}
  button.sign-in{width:100%;margin-top:8px;padding:12px;background:#1a2d4a;color:#fff;border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:0.9rem;font-weight:600;cursor:pointer;transition:background 0.15s;letter-spacing:0.02em}
  button.sign-in:hover{background:#2a8a7e}
  .error{margin-top:14px;font-size:0.78rem;color:#b91c1c;text-align:center;display:none;background:#fee2e2;padding:9px 14px;border-radius:7px}
  .footer{margin-top:28px;text-align:center;font-size:0.68rem;color:#6b7280}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1>Kinsealy Medical Centre</h1>
    <span>Staff Hub</span>
    <div class="logo-divider"></div>
  </div>
  <div class="field">
    <label for="usr">Username</label>
    <input type="text" id="usr" placeholder="Enter your username" autocomplete="username" autofocus
      onkeydown="if(event.key==='Enter')document.getElementById('pwd').focus()">
  </div>
  <div class="field">
    <label for="pwd">Password</label>
    <div class="pwd-wrap">
      <input type="password" id="pwd" placeholder="Enter your password" autocomplete="current-password"
        onkeydown="if(event.key==='Enter')login()">
      <button class="show-pwd" type="button" onclick="togglePwd()" title="Show/hide password">👁</button>
    </div>
  </div>
  <button class="sign-in" onclick="login()">Sign In</button>
  <div class="error" id="err">Incorrect username or password. Please try again.</div>
  <div class="footer">For access issues contact the Practice Manager</div>
</div>
<script>
// ── Staff directory (names/roles — passwords are verified server-side,
// never downloaded to the browser; see netlify/functions/auth.js) ─
// `editSections` (optional) lists the EDITABLE_SECTIONS keys below this user is
// authorised to request content changes to. This user has NO direct access to
// this production repo for that content — their hands-on editing (with Claude
// Code) happens in a separate, private "sandbox" repo containing only the
// files for the section(s) they're listed for (see EDITABLE_SECTIONS below and
// the sandbox repo's own README). Once they're happy with a change there, it
// must be manually reviewed and ported into this repo by the Practice Manager
// (or Claude Code acting on the PM's explicit instruction) before it goes live
// — that manual port is the sign-off gate. Full convention: see CLAUDE.md.
const USERS = {
  'fran':     {display:"Dr O'Reilly",          initials:'FO', role:'admin', jobRole:'doc'},
  'joanne':   {display:'Dr Dundon',            initials:'JD', role:'admin', jobRole:'doc'},
  'maria':    {display:'Maria Harding',        initials:'MH', role:'admin', jobRole:'pm'},
  'ciara':    {display:'Dr Dunleavy',          initials:'CD', role:'staff', jobRole:'doc'},
  'ruth':     {display:'Dr Devlin',            initials:'RD', role:'staff', jobRole:'doc', editSections:['roaccutane']},
  'eimear':   {display:'Dr Dunne',             initials:'ED', role:'staff', jobRole:'doc'},
  'laura':    {display:'Laura McGrath',        initials:'LM', role:'staff', jobRole:'nurse'},
  'susan':    {display:"Susan O'Leary",        initials:'SO', role:'staff', jobRole:'sec'},
  'michaela': {display:'Michaela Duffy-Meade', initials:'MD', role:'staff', jobRole:'sec,phle'},
  'holly':    {display:'Holly McCamley',       initials:'HM', role:'staff', jobRole:'sec'},
  'edel':     {display:'Edel Grimes',          initials:'EG', role:'staff', jobRole:'sec'},
  'amy':      {display:'Amy Burke',            initials:'AB', role:'staff', jobRole:'sec,phle'},
};

// ── Editable content sections registry ──
// Maps a section key (used in USERS[x].editSections) to the file(s)/anchor(s)
// it covers in THIS (production) repo, and the sandbox repo that mirrors that
// content for hands-on editing. To grant a new staff member edit rights to a
// new area: add a key here, add a matching file to the sandbox repo, and add
// the key to their `editSections` array above.
//
// `targets` is the machine-readable half, used by propose-edit.html and
// netlify/functions/edits.js: each entry is a file this section covers plus
// how a submission gets applied to it on approval —
//   mode:'whole'  — the proposed content replaces the entire file
//   mode:'anchor' — the proposed content replaces everything between the
//                   `<!-- SYNC:<marker>-BODY:START -->` / `...END -->`
//                   comment markers in that file (see index.html's
//                   Roaccutane SOP card for the marker convention)
// IMPORTANT: netlify/functions/edits.js keeps its own copy of this data
// (EDIT_GRANTS / EDIT_TARGETS) since Netlify functions can't import from an
// HTML file — the two MUST be kept in sync by hand when either changes.
const EDITABLE_SECTIONS = {
  roaccutane: {
    label: 'Roaccutane (Isotretinoin)',
    files: ['roaccutane-consent.html', 'index.html (SOP card id="sop-roaccutane")'],
    sandboxRepo: 'kinsealy-intranet-sandbox', // private repo — Ruth has Write access here only
    targets: [
      { file: 'roaccutane-consent.html', mode: 'whole', label: 'Consent form (roaccutane-consent.html)' },
      { file: 'index.html', mode: 'anchor', marker: 'ROACCUTANE', label: 'SOP card body (index.html)' }
    ]
  }
};

async function login() {
  const username = document.getElementById('usr').value.trim().toLowerCase();
  const password = document.getElementById('pwd').value;
  const err = document.getElementById('err');
  err.style.display = 'none';
  if (!username || !password) return;

  const user = USERS[username];
  if (!user) { err.textContent = 'Incorrect username or password. Please try again.'; err.style.display = 'block'; return; }

  const btn = document.querySelector('.sign-in');
  const originalLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Signing in…';

  try {
    const r = await fetch('/.netlify/functions/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'login', username, password })
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) {
      err.textContent = 'Incorrect username or password. Please try again.';
      err.style.display = 'block';
      return;
    }

    sessionStorage.setItem('kmc-token', j.token);
    sessionStorage.setItem('kmc-auth', '1');
    sessionStorage.setItem('kmc-user', username);
    sessionStorage.setItem('kmc-display', user.display);
    sessionStorage.setItem('kmc-initials', user.initials);
    sessionStorage.setItem('kmc-role', j.role); // server-verified, not client-claimed
    sessionStorage.setItem('kmc-job-role', user.jobRole || 'staff');
    sessionStorage.setItem('kmc-edit-sections', JSON.stringify(user.editSections || []));
    const dest = sessionStorage.getItem('kmc-redirect') || 'index.html';
    sessionStorage.removeItem('kmc-redirect');
    window.location.href = dest;
  } catch (e) {
    err.textContent = 'Could not reach the server. Please check your connection and try again.';
    err.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
}

function togglePwd() {
  const input = document.getElementById('pwd');
  input.type = input.type === 'password' ? 'text' : 'password';
}
</script>
</body>
</html>
